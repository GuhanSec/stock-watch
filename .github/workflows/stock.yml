name: Stock watch
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      URL: https://coromandelwatchco.com/products/blue-mountain-edition-gen-3-live-on-feb-4th-11-00am-ist
    steps:
      - name: Check availability
        run: |
          avail=$(curl -fsS -A "Mozilla/5.0" "$URL.js" | jq -r '.available')
          echo "available=$avail"
          if [ "$avail" = "true" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=IN STOCK: Blue Mountain Edition Gen 3 $URL"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "IN STOCK: Blue Mountain Edition Gen 3" --body "Available now: $URL"
            gh workflow disable stock.yml --repo "$GITHUB_REPOSITORY"
          fi
